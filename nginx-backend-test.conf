server {
        # This root directory must be created. It can be empty, holding only an empty index.html
        root /var/www/ledger.multiplos.cards;

        index index.html index.htm index.nginx-debian.html;

        server_name _;

        # If you want to block user self-registration, uncomment this:
        # location ~* ^/btoken/api/user/register$ {    
        #         return 403; # This is forbidden    
        # }   

        # If you want to block any route, you can use the pattern above. 
   
        # General btoken calls 
        location ~* /user-management {    
            rewrite /user-management/(.*) /$1 break;    
            proxy_pass http://127.0.0.1:8080;    
            proxy_set_header Host localhost:8080;    
            proxy_redirect off;    
            proxy_pass_request_headers on;    
        }    
        
        location ~* /financial-management {
            rewrite /financial-management/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8083;
            proxy_set_header Host localhost:8083;
            proxy_redirect off;
            proxy_pass_request_headers on;
        }

        location ~* /ledger-management {
            rewrite /ledger-management/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host localhost:8081;
            proxy_redirect off;
            proxy_pass_request_headers on;
        }

        location ~* /rwa-management {
            rewrite /rwa-management/(.*) /$1 break;
            proxy_pass http://127.0.0.1:8082;
            proxy_set_header Host localhost:8082;
            proxy_redirect off;
            proxy_pass_request_headers on;
        }
        
        location / {
                # First attempt to serve request as file, then
                # as directory, then fall back to displaying a 404.
                try_files $uri $uri/ =404;
        }
}
